# open-ALERT base station image: who may log in over SSH.
#
# Keys only. No password is accepted, for any account, and root cannot log in
# at all: an administrator logs in to their own account with their key and
# uses sudo. The account and its key come from the first set-up file
# (user-data, in the CIDATA partition).
#
# sshd takes the first value it reads for each setting, and reads the files in
# this folder in name order, so these lines win over any file named later.
# An organisation with its own SSH policy replaces or removes this file.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# There is no graphical desktop to forward.
X11Forwarding no
