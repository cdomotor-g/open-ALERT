#!/usr/sbin/nft -f
# open-ALERT base station image: the firewall.
#
# What may come in from other computers: SSH, the dashboard, ping, and the
# answers the network itself sends (addresses, routes). Everything else is
# thrown away. What this computer sends out is not limited here.
#
# This is one table of its own. It does not clear other tables, so the
# enterprise profile's own lock (table inet open_alert_base, which keeps the
# dashboard to this computer) stays in place when this file is loaded again.
# The two add up: a call must pass both.
#
# After changing this file:   sudo systemctl reload nftables
# To see what is loaded:      sudo nft list ruleset

# Start clean each time this file is loaded (make sure the table exists,
# remove it, make it again).
table inet open_alert_image
delete table inet open_alert_image

table inet open_alert_image {
	chain input {
		type filter hook input priority filter; policy drop;

		# Answers to what this computer itself asked for.
		ct state established,related accept
		ct state invalid drop
		# This computer talking to itself.
		iifname "lo" accept

		# Ping, and what IPv6 needs to find its neighbours and routers.
		icmp type echo-request accept
		meta l4proto ipv6-icmp accept
		# The network handing out an address (DHCP), for IPv4 and for IPv6.
		udp sport 67 udp dport 68 accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

		# SSH: keys only (see /etc/ssh/sshd_config.d/10-open-alert-image.conf).
		tcp dport 22 accept
		# The dashboard: port 80 in the standard profile; 8080 is where the
		# agent goes when it may not have 80, and the enterprise profile's
		# port (there the profile's own lock refuses other computers).
		tcp dport { 80, 8080 } accept

		counter comment "everything else that came in: thrown away"
	}
	chain forward {
		# This computer passes nothing on between networks.
		type filter hook forward priority filter; policy drop;
	}
}
