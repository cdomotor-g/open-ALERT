# open-ALERT base station image: how cloud-init behaves on this computer.
#
# cloud-init is the program that reads the first set-up file. Here it reads
# one place only: the files "user-data" and "meta-data" from the small
# partition labelled CIDATA on the disk this computer started from. It asks
# nothing of the network.

# Where set-up may come from: the files handed to it on this disk
# ("NoCloud"), or nowhere ("None": the computer starts with what the image
# has). No cloud provider's address is ever tried.
datasource_list: [ NoCloud, None ]

# NOT from any disk that happens to carry the label CIDATA. Left to itself,
# cloud-init searches every disk for that label and tries removable disks
# first, so a USB stick could set this computer up. "fs_label: null" switches
# that search off. The two files reach cloud-init another way: a small service
# that runs before it (open-alert-image-own-cidata.service) copies them from
# partition 2 of the disk that holds the main partition into
# /var/lib/cloud/seed/nocloud, the one folder cloud-init then reads.
# (cloud-init also takes a hint from the computer's own firmware, its
# serial-number field, and from the kernel's start-up line. The first is set
# only by whoever controls the firmware or a virtual machine's host; the
# second cannot be changed at the boot menu, which is closed on this image.)
datasource:
  NoCloud:
    fs_label: null

# The network is not cloud-init's business on this image. It is set up by
# systemd-networkd, from the files in /etc/systemd/network: every wired port
# asks the network for an address (DHCP). A fixed address is one more file
# there; the example user-data shows it.
network:
  config: disabled

# No account is made unless user-data names one. There is no "debian" or
# "admin" account waiting, and none has a password.
users: []
disable_root: true
ssh_pwauth: false

# This computer's SSH host keys are made once, at its first start, by
# open-alert-image-ssh-host-keys.service. cloud-init is told not to throw them
# away and make new ones when the set-up file is applied a second time.
ssh_deletekeys: false

# The computer's name comes from user-data ("hostname:"); keep /etc/hosts in step.
preserve_hostname: false
manage_etc_hosts: localhost

# Where Debian's updates come from is written by the image's build
# (/etc/apt/sources.list.d/debian.sources); cloud-init leaves it alone.
apt:
  preserve_sources_list: true

# Grow the main partition, and the file system in it, to fill the disk.
# Looked at on every start, so a disk copied later to a larger one grows too.
growpart:
  mode: auto
  devices: [ "/" ]
resize_rootfs: true
