# open-ALERT base station image: how cloud-init behaves on this computer.
#
# cloud-init is the program that reads the first set-up file. Here it reads
# one place only: the files "user-data" and "meta-data" in the small partition
# of this disk labelled CIDATA. It asks nothing of the network.

# Where set-up may come from: the CIDATA partition ("NoCloud"), or nowhere
# ("None": the computer starts with what the image has). No cloud provider's
# address is ever tried.
datasource_list: [ NoCloud, None ]

# The network is not cloud-init's business on this image. It is set up by
# systemd-networkd, from the files in /etc/systemd/network: every wired port
# asks the network for an address (DHCP). A fixed address is one more file
# there; the example user-data shows it.
network:
  config: disabled

# No account is made unless user-data names one. There is no "debian" or
# "admin" account waiting, and none has a password.
users: []
disable_root: true
ssh_pwauth: false

# This computer's SSH host keys are made once, at its first start, by
# open-alert-image-ssh-host-keys.service. cloud-init is told not to throw them
# away and make new ones when the set-up file is applied a second time.
ssh_deletekeys: false

# The computer's name comes from user-data ("hostname:"); keep /etc/hosts in step.
preserve_hostname: false
manage_etc_hosts: localhost

# Where Debian's updates come from is written by the image's build
# (/etc/apt/sources.list.d/debian.sources); cloud-init leaves it alone.
apt:
  preserve_sources_list: true

# Grow the main partition, and the file system in it, to fill the disk.
# Looked at on every start, so a disk copied later to a larger one grows too.
growpart:
  mode: auto
  devices: [ "/" ]
resize_rootfs: true
