# open-ALERT base station image: settings for GRUB, the boot menu.
# After changing this file:   sudo update-grub

# Show the menu for three seconds, as plain text.
GRUB_TIMEOUT=3
GRUB_TIMEOUT_STYLE=menu
GRUB_TERMINAL=console

# Start-up messages are shown, not hidden ("quiet" is left out): on a computer
# with no screen, the serial port is the only place a start-up fault can be read.
GRUB_CMDLINE_LINUX_DEFAULT=""
# Where the kernel's messages and a login prompt go. The build writes this
# line for the kind of processor (see build-image.sh).
GRUB_CMDLINE_LINUX="@CONSOLE@"

# No "recovery mode" entries in the menu: they lead to a prompt for root's
# password, and root has none on this image.
GRUB_DISABLE_RECOVERY=true

# Do not look on other disks for other operating systems to add to the menu.
GRUB_DISABLE_OS_PROBER=true
