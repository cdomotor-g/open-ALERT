# open-ALERT base station image: looking up names.
#
# Names are looked up with the name servers the network hands out, and no
# other way: the two kinds of look-up that listen for other computers on the
# local network (LLMNR on port 5355, multicast DNS on port 5353) are off, so
# nothing here listens for them.
[Resolve]
LLMNR=no
MulticastDNS=no
