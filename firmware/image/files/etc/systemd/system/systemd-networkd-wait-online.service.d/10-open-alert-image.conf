# open-ALERT base station image: "the network is up" means one port is up.
#
# Debian's own setting waits for every port, for up to two minutes: on a
# computer with two ports and one cable that is two minutes for nothing at
# each start. Here: any one port, and at most 45 seconds. Nothing the base
# station needs waits for this (the agent starts, receives and keeps what it
# hears without a network); only the first set-up and the update check do.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=45
