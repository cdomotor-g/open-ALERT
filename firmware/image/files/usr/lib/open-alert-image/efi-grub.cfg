# open-ALERT base station image: where GRUB finds its menu.
#
# This file sits beside GRUB on the EFI partition (EFI/debian/grub.cfg). GRUB
# reads it first, and it says where the menu itself is: on partition 3 (the
# main partition) of the very disk GRUB was started from, and nowhere else.
#
# Debian's own version of this file looks instead for "the first disk that
# carries the main partition's identifier". Every disk made from the image
# carries that same identifier, so a USB stick made from it, plugged in at a
# restart, could hand GRUB a menu of its own: one with no owner, that starts
# Linux in any way it likes. This file never looks at another disk.
#
# When a GRUB or shim update writes Debian's version again, the image puts
# this one back at once (/usr/lib/open-alert-image/boot-stub, run by
# open-alert-image-boot-stub.path and by the menu maker).

# The menu's owner, who has no password, is named here already, so that GRUB's
# command line stays closed even if the menu below cannot be read.
set superusers="open-alert-nobody"
export superusers

# Where GRUB was started from: "(hd0,gpt1)/EFI/debian" — the disk, then
# partition 1, the EFI partition. The main partition is partition 3 of that disk.
set oa_main=
if regexp --set=1:oa_disk '^\(([^(),]+),gpt1\)' "$prefix"; then
  set oa_main="$oa_disk,gpt3"
fi
if [ -n "$oa_main" ]; then
  if [ -f "($oa_main)/boot/grub/grub.cfg" ]; then
    set root="$oa_main"
    set prefix="($oa_main)/boot/grub"
    # The menu's entries start Linux from here too (see /etc/grub.d/09_open-alert-image).
    export oa_main
    configfile "$prefix/grub.cfg"
    # Back here only when somebody left the menu (Esc): start again, no prompt.
    echo "open-alert-image: the boot menu was left. Restarting in 5 seconds."
    sleep 5
    reboot
  fi
fi

echo "open-alert-image: NOT STARTING. The boot menu was not found on this disk's own main partition (GRUB started from $prefix; looked on partition 3 of the same disk: \"$oa_main\"). No other disk is looked at. Restarting in 60 seconds."
sleep 60
reboot
