# open-ALERT base station: an RTL-SDR stick is a radio receiver here, not a
# digital-TV tuner. Without this the kernel's TV driver takes the stick when it
# is plugged in and rtl_sdr cannot open it ("usb_claim_interface error -6").
# The names are the ones in RPi ALERT's own list (os/files/modprobe/rpi-alert-blacklist-dvb.conf).
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2832_sdr
blacklist rtl2830
blacklist r820t
