# open-ALERT base station: the two kernel drivers for USB serial ports, loaded
# when the computer starts rather than when the first such device is plugged in.
#
# Why: the service may open USB serial ports and no other kind of device, and
# systemd works that list out when the service starts, from the drivers the
# kernel has loaded by then. Without this, a serial receiver (a Quansheng
# radio, an ERT-A2, a GPS) plugged in for the first time after the service
# started would be refused until the service is restarted.
#
# On a kernel built without these drivers (some cloud kernels), systemd reports
# that it could not load them. Nothing else is affected; to stop the report, put
# an empty file of this name in /etc/modules-load.d/.
usbserial
cdc_acm
