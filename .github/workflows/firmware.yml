name: firmware

# Builds and checks everything under firmware/ — the native package, the
# container and the disk images — on GitHub's own computers, for ordinary
# 64-bit PCs (x86-64) and for 64-bit ARM. Nothing here uses a real radio
# stick: see "What has been tested, and where" in firmware/README.md.
#
# It runs when a push changes something under firmware/ (or this file), and
# when a person starts it by hand (Actions → firmware → Run workflow). Nothing
# else starts it.
#
# Started by hand WITH a release tag, and only then, it also publishes: the
# container to ghcr.io/<owner>/open-alert-base, and a GitHub release under that
# tag with the package, the disk images, their checksums, a bill of materials
# for each, and GitHub's signed record of where each file was built
# ("build provenance"). It publishes only what passed its checks in the same
# run, and:
#   - only from the main branch;
#   - only under a tag that is not in use: not as a git tag, not as a release,
#     not as a container. Nothing published before is ever written over;
#   - in this order: every check, then the release as a draft nobody else
#     sees, then the container under its name, then the release made public.
#     A run that stops half-way leaves no public release and no container
#     under the release's name.
# The jobs that publish name the environment "release". GitHub makes it the
# first time, with no rules; the owner can then limit it to the main branch
# and ask for an approval (Settings → Environments → release), which a changed
# copy of this file on another branch cannot get round.
#
# The only actions used are GitHub's own (actions/…): checkout, the two that
# keep and fetch a job's files, and the one that writes build provenance.
# Each is pinned to one exact commit; its version is in the comment beside
# it. To move one, look the new commit up
# (git ls-remote https://github.com/actions/NAME refs/tags/vX.Y.Z) and change
# both. Signing in to the container registry is one line of "docker login",
# not an action.
#
# This file has not yet run on GitHub: its first push is its first run. See
# "How it is built and checked automatically" in firmware/README.md.

on:
  push:
    # Branches are named so that a tag being made does not start a run.
    branches: ['**']
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release under this tag (for example firmware-0.23.1-oa2). Leave empty to build and check only.'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark the release "pre-release". Leave on until an image has started on a real computer and heard a real stick.'
        required: false
        default: true
        type: boolean

# No job may do anything it does not ask for by name.
permissions: {}

# A newer push stops an older run of the same branch. A release run is never
# stopped half-way by a push: it has a group of its own.
concurrency:
  group: firmware-${{ github.ref }}-${{ inputs.release_tag || 'check' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  # ── (a) the scripts ────────────────────────────────────────────────────────
  scripts:
    name: Scripts (shellcheck); and, for a release, that it may be made
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read         # for a release: is the container's tag already in use?
    outputs:
      base_image: ${{ steps.base.outputs.base_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every shell script under firmware/ passes shellcheck
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends shellcheck; }
          files=()
          while IFS= read -r f; do
            if head -n 1 "$f" | grep -Eq '^#!.*[/ ](ba)?sh( |$)'; then files+=("$f"); fi
          done < <(git ls-files firmware)
          echo "shellcheck $(shellcheck --version | awk '/^version:/ {print $2}') on ${#files[@]} scripts:"
          printf '  %s\n' "${files[@]}"
          LC_ALL=C.UTF-8 shellcheck -x "${files[@]}"
      # Everything below is for a release only. Every job that publishes
      # needs this job, so a release that may not be made stops here, before
      # anything is published.
      - name: The release tag is a plain name, on one line
        if: ${{ inputs.release_tag != '' }}
        run: |
          set -euo pipefail
          # The whole value at once (not line by line): one line, and plain characters only.
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,80}$ ]]; then
            echo "::error::The release tag may hold letters, digits, dots, dashes and underscores only, on one line (no \"+\": the same name is given to the container, and a container's tag may not hold one)."
            exit 1
          fi
      - name: A release is made from the main branch only
        if: ${{ inputs.release_tag != '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::This run is on $GITHUB_REF. A release is published from the main branch only: start the workflow again with \"main\" chosen."
            exit 1
          fi
      - name: The release tag is not in use (as a git tag, a release, or a container)
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          used=''
          tags=$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$RELEASE_TAG")
          if [ -n "$tags" ]; then used="$used a git tag;"; fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then used="$used a release (published or draft);"; fi
          # A container that is there answers; anything else (no such container yet, no such tag) does not.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin > /dev/null
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/open-alert-base"
          for t in "$RELEASE_TAG" "$RELEASE_TAG-amd64" "$RELEASE_TAG-arm64"; do
            if docker buildx imagetools inspect "$name:$t" > /dev/null 2>&1; then used="$used the container $name:$t;"; fi
          done
          if [ -n "$used" ]; then
            echo "::error::The tag $RELEASE_TAG is already in use:$used Nothing that was published is written over. Choose another tag, or remove those first if they are left over from a run that failed."
            exit 1
          fi
          echo "The tag $RELEASE_TAG is free." >> "$GITHUB_STEP_SUMMARY"
      - name: The container's base image, as Debian has it at this moment (one exact version, for both kinds of processor)
        id: base
        if: ${{ inputs.release_tag != '' }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect debian:trixie-slim --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "::error::could not read the digest of debian:trixie-slim"; exit 1; fi
          echo "base_image=debian:trixie-slim@$digest" >> "$GITHUB_OUTPUT"
          echo "The published container is built on \`debian:trixie-slim@$digest\`." >> "$GITHUB_STEP_SUMMARY"

  # ── (b) the native package ─────────────────────────────────────────────────
  package:
    name: Package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # "systemd": the part of the check that runs the service under a real
        # systemd, in a container. On a PC it is required: if systemd will not
        # start there, the job fails. On ARM it is wanted: a skip is a warning
        # on the run, not a failure, until a first run has shown it starts.
        include:
          - { arch: amd64, runner: ubuntu-24.04, systemd: required }
          - { arch: arm64, runner: ubuntu-24.04-arm, systemd: wanted }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck lintian openssl
      # The two files are handed to each script by option. They are not put in
      # the variables the scripts read by themselves (OA_AGENT_TARBALL,
      # OA_AGENT_SIG): test/deb.sh checks what the release check does when it
      # is given a tarball without a signature, and such a variable would hand
      # it one behind its back.
      - name: The pinned RPi ALERT release, downloaded once and checked (hash and signature)
        run: |
          set -euo pipefail
          firmware/lib/fetch-agent.sh --verify-only --download-dir "$RUNNER_TEMP/release"
          tarball=$(find "$RUNNER_TEMP/release" -name '*-src.tar.gz' | head -n 1)
          echo "PINNED_TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "PINNED_SIG=$tarball.sig" >> "$GITHUB_ENV"
      - name: Build the package
        run: firmware/deb/build-deb.sh --tarball "$PINNED_TARBALL" --sig "$PINNED_SIG" --lintian
      - name: Check it (firmware/test/deb.sh — Debian 13, Ubuntu 24.04, Debian 12; about 30 minutes)
        env:
          SYSTEMD_PART: ${{ matrix.systemd }}
        run: |
          set -euo pipefail
          deb=$(find dist -maxdepth 1 -name 'open-alert-base_*_all.deb' | head -n 1)
          extra=()
          if [ "$SYSTEMD_PART" = required ]; then extra+=(--require-systemd); fi
          rc=0
          firmware/test/deb.sh --deb "$deb" --tarball "$PINNED_TARBALL" --sig "$PINNED_SIG" "${extra[@]}" 2>&1 | tee "$RUNNER_TEMP/deb-test.txt" || rc=$?
          {
            echo "### Package checks on ${{ matrix.arch }}"
            echo '```'
            grep -E '^[0-9]+ passed, |^FAIL  |^skip  ' "$RUNNER_TEMP/deb-test.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The part under a real systemd holds the strongest checks (the
          # sandbox tried from inside, the lock that stops the agent). It is
          # never passed over in silence.
          if grep -Eq '^skip  .*systemd would not start' "$RUNNER_TEMP/deb-test.txt"; then
            echo "::warning::On ${{ matrix.arch }}, systemd would not start in a container on this runner: the package was NOT checked under a real systemd here."
          fi
          exit "$rc"
      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.arch }}
          path: dist/open-alert-base_*_all.deb
          if-no-files-found: error
          retention-days: 14
      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-package-${{ matrix.arch }}
          path: dist/test-logs/
          if-no-files-found: ignore
          retention-days: 14

  # The package holds no compiled code: built on a PC and on an ARM computer
  # it must be the same file, byte for byte.
  package-same:
    name: Package is the same file from both kinds of computer
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: packages
      - run: |
          set -euo pipefail
          sha256sum packages/package-amd64/*.deb packages/package-arm64/*.deb
          cmp packages/package-amd64/*.deb packages/package-arm64/*.deb

  # ── (c) the container ──────────────────────────────────────────────────────
  container:
    name: Container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck openssl socat
          # The check script itself is helped by Node.js on this computer;
          # GitHub's computers have one, and this is for the day one does not.
          command -v node >/dev/null || sudo apt-get install -y --no-install-recommends nodejs
      - name: The pinned RPi ALERT release, downloaded once and checked (hash and signature)
        run: |
          set -euo pipefail
          firmware/lib/fetch-agent.sh --verify-only --download-dir "$RUNNER_TEMP/release"
          tarball=$(find "$RUNNER_TEMP/release" -name '*-src.tar.gz' | head -n 1)
          echo "PINNED_TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "PINNED_SIG=$tarball.sig" >> "$GITHUB_ENV"
      - name: Build and check the container (firmware/test/container.sh)
        run: |
          set -euo pipefail
          rc=0
          firmware/test/container.sh --tarball "$PINNED_TARBALL" --sig "$PINNED_SIG" 2>&1 | tee "$RUNNER_TEMP/container-test.txt" || rc=$?
          {
            echo "### Container checks on ${{ matrix.arch }}"
            echo '```'
            grep -E '^[0-9]+ passed, |^FAIL  |^skip  ' "$RUNNER_TEMP/container-test.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-container-${{ matrix.arch }}
          path: dist/test-logs/
          if-no-files-found: ignore
          retention-days: 14

  # ── (d) the disk images ────────────────────────────────────────────────────
  image-amd64:
    name: Disk image for PCs (amd64) — build, then start it with Secure Boot on
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools (Debian's installer-into-a-folder, disk tools, QEMU and its UEFI firmware)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mmdebstrap debian-archive-keyring fdisk dosfstools mtools \
            e2fsprogs xz-utils jq openssl socat sbsigntool qemu-system-x86 ovmf
      - name: Let this job use the processor's own virtualisation (KVM), where GitHub's computer has it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "No /dev/kvm here: the start test will emulate the processor, slowly."
          fi
      - name: The pinned RPi ALERT release, downloaded once and checked (hash and signature)
        run: |
          set -euo pipefail
          firmware/lib/fetch-agent.sh --verify-only --download-dir "$RUNNER_TEMP/release"
          tarball=$(find "$RUNNER_TEMP/release" -name '*-src.tar.gz' | head -n 1)
          echo "PINNED_TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "PINNED_SIG=$tarball.sig" >> "$GITHUB_ENV"
      - name: Build the image (firmware/image/build-image.sh)
        run: |
          set -euo pipefail
          sudo firmware/image/build-image.sh --arch amd64 --tarball "$PINNED_TARBALL" --sig "$PINNED_SIG"
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Start it and check it (firmware/test/image.sh)
        run: |
          set -euo pipefail
          rc=0
          firmware/test/image.sh --arch amd64 2>&1 | tee "$RUNNER_TEMP/image-test.txt" || rc=$?
          {
            echo "### Disk image for PCs: start test"
            echo '```'
            grep -E '^[0-9]+ passed, |^FAIL  |^skip  |EXPOSURE SCORE|a login prompt on the serial console' "$RUNNER_TEMP/image-test.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Keep the image, its checksum and its lists of contents
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-amd64
          path: |
            dist/open-alert-base-*-amd64-uefi.img.xz
            dist/open-alert-base-*-amd64-uefi.img.xz.sha256
            dist/open-alert-base-*-amd64-uefi.packages.tsv
            dist/open-alert-base-*-amd64-uefi.spdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-image-amd64
          path: dist/test-logs/
          if-no-files-found: ignore
          retention-days: 14

  # The ARM image is built on an ARM computer (the build does not cross over).
  # Its start test has never been run by anybody: the first runs of this job
  # are its first runs. So a failed start test does not fail the whole run —
  # but an ARM image whose start test did not pass is not published.
  image-arm64:
    name: Disk image for 64-bit ARM (arm64) — build, then try to start it
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      started: ${{ steps.start.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mmdebstrap debian-archive-keyring fdisk dosfstools mtools \
            e2fsprogs xz-utils jq openssl socat sbsigntool qemu-system-arm qemu-efi-aarch64
      - name: The pinned RPi ALERT release, downloaded once and checked (hash and signature)
        run: |
          set -euo pipefail
          firmware/lib/fetch-agent.sh --verify-only --download-dir "$RUNNER_TEMP/release"
          tarball=$(find "$RUNNER_TEMP/release" -name '*-src.tar.gz' | head -n 1)
          echo "PINNED_TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "PINNED_SIG=$tarball.sig" >> "$GITHUB_ENV"
      - name: Build the image (firmware/image/build-image.sh)
        run: |
          set -euo pipefail
          sudo firmware/image/build-image.sh --arch arm64 --tarball "$PINNED_TARBALL" --sig "$PINNED_SIG"
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Try to start it (firmware/test/image.sh; QEMU emulating an ARM computer)
        id: start
        continue-on-error: true
        run: |
          set -euo pipefail
          rc=0
          firmware/test/image.sh --arch arm64 2>&1 | tee "$RUNNER_TEMP/image-test.txt" || rc=$?
          {
            echo "### Disk image for ARM: start test"
            echo '```'
            grep -E '^[0-9]+ passed, |^FAIL  |^skip  |EXPOSURE SCORE|a login prompt on the serial console' "$RUNNER_TEMP/image-test.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Say so plainly if it did not start
        if: ${{ steps.start.outcome != 'success' }}
        run: echo "::warning::The ARM disk image was built but did NOT pass its start test. It will not be published. See the logs of this job."
      - name: Keep the image, its checksum and its lists of contents
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-arm64
          path: |
            dist/open-alert-base-*-arm64-uefi.img.xz
            dist/open-alert-base-*-arm64-uefi.img.xz.sha256
            dist/open-alert-base-*-arm64-uefi.packages.tsv
            dist/open-alert-base-*-arm64-uefi.spdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Keep the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-image-arm64
          path: dist/test-logs/
          if-no-files-found: ignore
          retention-days: 14

  # ── (e) the benchmark's quick test ─────────────────────────────────────────
  bench:
    name: Benchmark, quick test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js, if this computer has none
        run: command -v node >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends nodejs; }
      - name: The pinned RPi ALERT release, checked and unpacked
        run: firmware/lib/fetch-agent.sh --out "$RUNNER_TEMP/release"
      - name: firmware/bench/test.sh
        run: |
          node --version
          firmware/bench/test.sh "$RUNNER_TEMP/release/agent"

  # ── (f) publishing — only with a release tag ───────────────────────────────
  # In this order, each step only after the one before it:
  #   1. container-publish   each kind of computer builds the container, checks
  #                          that very image, and pushes it under a name of its
  #                          own (<tag>-amd64, <tag>-arm64)
  #   2. release             the release is put together and made as a DRAFT,
  #                          which nobody but the owner sees
  #   3. container-manifest  the two containers are joined under the release's
  #                          name (<tag>)
  #   4. release-publish     the draft is made public
  # Every one of them needs every check above to have passed in this run, the
  # ARM disk image's build included.
  container-publish:
    name: Publish the container (${{ matrix.arch }})
    if: ${{ inputs.release_tag != '' }}
    needs: [scripts, package, package-same, container, image-amd64, image-arm64, bench]
    environment: release
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      BASE_IMAGE: ${{ needs.scripts.outputs.base_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck openssl socat
          # The check script itself is helped by Node.js on this computer;
          # GitHub's computers have one, and this is for the day one does not.
          command -v node >/dev/null || sudo apt-get install -y --no-install-recommends nodejs
      - name: The pinned RPi ALERT release, downloaded once and checked (hash and signature)
        run: |
          set -euo pipefail
          firmware/lib/fetch-agent.sh --verify-only --download-dir "$RUNNER_TEMP/release"
          tarball=$(find "$RUNNER_TEMP/release" -name '*-src.tar.gz' | head -n 1)
          echo "PINNED_TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "PINNED_SIG=$tarball.sig" >> "$GITHUB_ENV"
      - name: Build the image that will be published (firmware/container/build.sh), on the one base image named by the first job
        run: |
          set -euo pipefail
          # Only values that have been looked at go into the file later steps read.
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,80}$ ]] || { echo "::error::the release tag is not a plain name"; exit 1; }
          [[ "$BASE_IMAGE" =~ ^debian:trixie-slim@sha256:[0-9a-f]{64}$ ]] || { echo "::error::the first job named no base image"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/open-alert-base:${RELEASE_TAG}-${{ matrix.arch }}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          firmware/container/build.sh --tag "$image" --release-dir "$RUNNER_TEMP/release" --base-image "$BASE_IMAGE"
      - name: Check that very image (firmware/test/container.sh --image)
        run: firmware/test/container.sh --image "$IMAGE" --tarball "$PINNED_TARBALL" --sig "$PINNED_SIG"
      - name: Sign in to GitHub's container registry (ghcr.io) with this run's own token
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push it, under this kind of computer's own name
        run: docker push "$IMAGE"

  release:
    name: Release (made as a draft)
    if: ${{ inputs.release_tag != '' }}
    needs: [scripts, package, package-same, container, image-amd64, image-arm64, bench, container-publish]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write        # make the draft release
      id-token: write        # sign the provenance as this run
      attestations: write    # record it with GitHub
    env:
      ARM_IMAGE_STARTED: ${{ needs.image-arm64.outputs.started }}
      BASE_IMAGE: ${{ needs.scripts.outputs.base_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-amd64
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.image-arm64.outputs.started == 'success' }}
        with:
          name: image-arm64
          path: release
      - name: Put the release together (bill of materials for the package, checksums, notes)
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,80}$ ]] || { echo "::error::the release tag is not a plain name"; exit 1; }
          cd release
          # Each image is still the file its own build hashed.
          for f in *.img.xz.sha256; do sha256sum -c "$f"; done
          deb=$(find . -maxdepth 1 -name 'open-alert-base_*_all.deb' -printf '%f\n' | head -n 1)
          ../firmware/image/sbom.sh --deb "$deb" > "${deb%.deb}.spdx.json"
          # One list of checksums for everything in the release (the images'
          # own .sha256 files aside: they are checksums already).
          find . -maxdepth 1 -type f ! -name '*.sha256' -printf '%f\n' | LC_ALL=C sort | xargs -d '\n' sha256sum -- > ../SHA256SUMS
          mv ../SHA256SUMS .
          sha256sum -c SHA256SUMS
          pin() { sed -n "s|^$1=\([A-Za-z0-9._:/+=-]*\)\$|\1|p" ../firmware/PIN | tail -n 1; }
          container="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/open-alert-base:${RELEASE_TAG}"
          {
            echo "open-ALERT base station firmware: the RPi ALERT agent $(pin AGENT_TAG), unchanged from its signed release, for computers that are not a Raspberry Pi."
            echo
            echo "**Nothing here has been run with a real radio stick on a computer that is not a Raspberry Pi, and the disk images have only been started in a virtual machine.** What has been tested, and where, is in [firmware/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/firmware/README.md)."
            echo
            echo "| File | What it is |"
            echo "|---|---|"
            echo "| \`$deb\` | The native package, for Debian 13 and Ubuntu 24.04, PCs and 64-bit ARM alike |"
            for f in *-amd64-uefi.img.xz; do echo "| \`$f\` | A ready-to-flash disk image for ordinary 64-bit PCs (UEFI; starts with Secure Boot on) |"; done
            if [ "$ARM_IMAGE_STARTED" = success ]; then
              for f in *-arm64-uefi.img.xz; do echo "| \`$f\` | The same for 64-bit ARM computers with UEFI firmware |"; done
            fi
            echo "| \`*.spdx.json\`, \`*.packages.tsv\` | For each of the above, the list of everything inside it with versions (a software bill of materials) |"
            echo "| \`SHA256SUMS\`, \`*.sha256\` | Checksums |"
            echo
            if [ "$ARM_IMAGE_STARTED" != success ]; then
              echo "The disk image for 64-bit ARM is **not** in this release: it was built, but it did not pass its start test in this run."
              echo
            fi
            echo "The container: \`$container\` (linux/amd64 and linux/arm64), built on \`$BASE_IMAGE\`:"
            echo
            echo '```'
            echo "docker pull $container"
            echo '```'
            echo
            echo "Built by GitHub Actions from commit ${GITHUB_SHA}. Each file has GitHub's signed record of where it was built. To check what you downloaded (the first line checks the files you have and passes over the ones you did not download):"
            echo
            echo '```'
            echo "sha256sum -c --ignore-missing SHA256SUMS"
            echo "gh attestation verify $deb --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } > ../notes.md
          ls -l
          cat ../notes.md
      - name: GitHub's signed record of where each file was built (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.deb
            release/*.img.xz
            release/*.spdx.json
            release/*.packages.tsv
      - name: Make the release, as a draft (nobody else sees it yet)
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "open-ALERT base station firmware $RELEASE_TAG" --notes-file notes.md "${flags[@]}" release/*
          # The files on the release must carry the names their checksums use.
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > published.txt
          find release -maxdepth 1 -type f -printf '%f\n' | sort > built.txt
          diff built.txt published.txt || { echo "::error::The draft release's files do not carry the names they were built with (see above). The draft is left for the owner to look at and delete."; exit 1; }

  container-manifest:
    name: Publish the container under one name for both kinds of computer
    if: ${{ inputs.release_tag != '' }}
    needs: release
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write        # push the joined image and its provenance to ghcr.io
      id-token: write        # sign the provenance as this run
      attestations: write    # record it with GitHub
    steps:
      - name: Sign in to GitHub's container registry (ghcr.io) with this run's own token
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Join the two images into one two-architecture image
        id: join
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,80}$ ]] || { echo "::error::the release tag is not a plain name"; exit 1; }
          name="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/open-alert-base"
          docker buildx imagetools create --tag "$name:$RELEASE_TAG" "$name:$RELEASE_TAG-amd64" "$name:$RELEASE_TAG-arm64"
          digest=$(docker buildx imagetools inspect "$name:$RELEASE_TAG" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::could not read the joined image's digest"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published: \`$name:$RELEASE_TAG\` (\`$digest\`), for linux/amd64 and linux/arm64" >> "$GITHUB_STEP_SUMMARY"
      - name: GitHub's signed record of where the image was built (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.join.outputs.name }}
          subject-digest: ${{ steps.join.outputs.digest }}
          push-to-registry: true

  release-publish:
    name: Make the release public (the last step)
    if: ${{ inputs.release_tag != '' }}
    needs: container-manifest
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write        # make the tag and publish the draft
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,80}$ ]] || { echo "::error::the release tag is not a plain name"; exit 1; }
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          url=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "Released: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "If this is the first container this repository has published, it is private until its owner makes it public: see \"A release\" in firmware/README.md." >> "$GITHUB_STEP_SUMMARY"
